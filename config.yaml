camera:
  source: 0          # 0 = default webcam; or a path to a video file
  width: 640
  height: 480

detection:
  model: "yolo11n.pt"      # nano = fastest. Use yolov8n.pt if 11 gives trouble
  confidence: 0.4
  device: "cpu"            # change to "cuda" if torch.cuda.is_available()

spatial:
  left_boundary: 0.33
  right_boundary: 0.66
  top_boundary: 0.33
  bottom_boundary: 0.66

display:
  show_window: true
  show_fps: true
  show_zones: true
  summary_every: 15        # print a sentence every N frames, not every frame